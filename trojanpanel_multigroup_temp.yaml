#--------------------------------------------------------------------------------------#
#-------------------------------WrittenByLiebesleid------------------------------------#
#--------------------------------------------------------------------------------------#
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
routing-mark: 7894
mode: rule
ipv6: false
allow-lan: true
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome
#--------------------------------------------------------------------------------------#
external-controller: 0.0.0.0:7788
secret: "123456"
external-ui: WebUI/ZashBoard
external-ui-url: "https://gh-proxy.com/github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
#--------------------------------------------------------------------------------------#
tun:
  enable: true
  stack: mixed
  device: Meta
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  auto-redirect: true
  dns-hijack:
    - any:53
    - tcp://any:53
    - any:853
    - tls://any:853
    - tcp://any:853
#--------------------------------------------------------------------------------------#
geodata-mode: true
geox-url:
  geoip: "https://gh-proxy.com/raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat"
  geosite: "https://gh-proxy.com/github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"
  mmdb: "https://gh-proxy.com/github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
#--------------------------------------------------------------------------------------#
profile:
  store-selected: true
  store-fake-ip: true
#--------------------------------------------------------------------------------------#
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443, 5228-5230]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - 'Mijia Cloud'
    - 'dlg.io.mi.com'
    - '*.push.apple.com'
    - '*.apple.com'
    - '*.wechat.com'
    - '*.qpic.cn'
    - '*.qq.com'
    - '*.wechatapp.com'
    - '*.vivox.com'
    # 向日葵服务
    - '*.oray.com'
    - '*.sunlogin.net'
#--------------------------------------------------------------------------------------#
hosts:
  services.googleapis.cn: services.googleapis.com
  googleapis.cn: googleapis.com
  google.cn: google.com
#--------------------------------------------------------------------------------------#
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - 'rule-set:VoidFakeIPBypass'
  default-nameserver:
    - 'tls://1.1.1.1'
    - 'tls://8.8.8.8'
    - 'tls://223.5.5.5'
    - '119.29.29.29'
  nameserver:
    - 'https://8.8.8.8/dns-query#PROXY'
    - 'https://1.1.1.1/dns-query#PROXY'
    - 'https://9.9.9.9/dns-query#PROXY'
    - 'https://208.67.222.222/dns-query#PROXY'
  direct-nameserver:
    - 'system'
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  nameserver-policy:
    'rule-set:FinanceFallback,FinanceGlobal,CryptoGlobal':
      - 'https://8.8.8.8/dns-query#跨境金融'
      - 'https://1.1.1.1/dns-query#跨境金融'
      - 'https://9.9.9.9/dns-query#跨境金融'
      - 'https://208.67.222.222/dns-query#跨境金融'
    '+.uegov.org':
      - 'https://223.5.5.5/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    'rule-set:cn_domain,blackmatrix7_direct,Tencent,NetEase,Alibaba,AliPay,JingDong,ShiJiChaoXing,UnionPay,GameDownloadCN,EPIC,SteamCN':
      - 'system'
    'geosite:category-games@cn':
      - 'system'
    'rule-set:VoidGlobalLegal':
      - 'system'
    'rule-set:VoidAI':
      - 'https://8.8.8.8/dns-query#AI'
      - 'https://1.1.1.1/dns-query#AI'
      - 'https://9.9.9.9/dns-query#AI'
      - 'https://208.67.222.222/dns-query#AI'
    'rule-set:Gemini,Google':
      - 'https://8.8.8.8/dns-query#Google'
      - 'https://1.1.1.1/dns-query#Google'
      - 'https://9.9.9.9/dns-query#Google'
      - 'https://208.67.222.222/dns-query#Google'
    'rule-set:eBay,Amazon,AmazonCN,AmazonTrust':
      - 'https://8.8.8.8/dns-query#海淘购物'
      - 'https://1.1.1.1/dns-query#海淘购物'
      - 'https://9.9.9.9/dns-query#海淘购物'
      - 'https://208.67.222.222/dns-query#海淘购物'
    'rule-set:BiliBili':
      - 'system'
      - 'https://8.8.8.8/dns-query#哔哩哔哩'
      - 'https://1.1.1.1/dns-query#哔哩哔哩'
      - 'https://9.9.9.9/dns-query#哔哩哔哩'
      - 'https://208.67.222.222/dns-query#哔哩哔哩'
