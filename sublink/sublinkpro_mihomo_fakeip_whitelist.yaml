# ========================================
# 📌 SublinkPro 节点注入区
# ========================================
# SublinkPro 会把订阅筛选后的节点写入此处。
# 节点名由订阅脚本使用 SublinkPro 元数据生成，NodeNameRule 只负责最终拼接。
# 下方策略组按可见国旗、AI/流媒体和自建标签完成动态映射。
proxies: ~

# AI 稳定节点定义，手动选择你的AI稳定节点
# 请替换为你客户端显示的实际节点名称（包括前缀）
# 示例："1.p1 »🇺🇸 美国-01|1.p1 »🇸🇬 新加坡-01"
# 语法为：机场 » 节点名称，中间用竖线 | 分隔多个节点，也可以使用自建节点
aift: &aift
  "(?i)(1.p1 »🇺🇸 美国-01|1.p1 »🇸🇬 新加坡-01)"

# 家宽节点只允许作为“家宽手选”的直接成员。
home-node-exclude: &home-node-exclude '(?:^| )家宽(?: |#|$)'

# ========================================
# 📌 模板定义区
# ========================================

# 通用引用模板
pg: &pg
  type: select
  proxies:
    - 自动选择
    - 全部手选
    - 地区手选
    - 自建手选
    - 家宽手选
    - 负载均衡-US
    - 负载均衡-HK
    - 负载均衡-SG
    - 负载均衡-JP
    - 负载均衡-其他
    - 自动测速-US
    - 自动测速-HK
    - 自动测速-SG
    - 自动测速-JP
    - 自动测速-其他
    - 故障转移-US
    - 故障转移-HK
    - 故障转移-SG
    - 故障转移-JP
    - 故障转移-其他

# 负载均衡模板
rtt-lb: &rtt-lb
  type: load-balance
  include-all: true
  exclude-filter: *home-node-exclude
  lazy: false
  interval: 600
  strategy: round-robin
  max-failed-times: 3
  tolerance: 80
  url: https://cp.cloudflare.com/generate_204

# 自动测速模板
auto-test: &auto-test
  type: url-test
  include-all: true
  exclude-filter: *home-node-exclude
  lazy: false
  interval: 120
  tolerance: 20
  url: https://cp.cloudflare.com/generate_204

# 故障转移模板
fallback: &fallback
  type: fallback
  include-all: true
  exclude-filter: *home-node-exclude
  lazy: false
  interval: 60
  max-failed-times: 3
  url: https://cp.cloudflare.com/generate_204

# AI 解锁节点自动测速模板
ai-test: &ai-test
  type: url-test
  include-all: true
  exclude-filter: *home-node-exclude
  url: https://cp.cloudflare.com/generate_204
  interval: 3600
  tolerance: 50
  lazy: false

